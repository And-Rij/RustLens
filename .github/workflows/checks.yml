name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: '12.11.2'
          cache: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Download and verify OCR models
        run: pnpm models:download
      - name: Frontend typecheck and build
        run: pnpm build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: OCR integration test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib recognizes_english_fixture -- --ignored
      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
